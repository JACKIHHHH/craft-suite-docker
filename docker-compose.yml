name: craftsuite

services:
  # Servidor web: sirve las apps (archivos estáticos) en http://<ip>:8099
  craftsuite:
    image: nginx:1.27-alpine
    container_name: ${CRAFT_NAME:-craftsuite}
    restart: unless-stopped
    ports:
      - "${CRAFT_PORT:-8099}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Descarga / actualiza las apps desde GitHub. No arranca solo:
  #   docker compose run --rm actualizar
  actualizar:
    image: alpine:3.20
    profiles: ["update"]
    volumes:
      - ./:/w
    command: ["sh", "/w/actualizar.sh"]

  # Opcional: busca versiones nuevas al arrancar y luego una vez por semana.
  # Se activa con COMPOSE_PROFILES=auto en el archivo .env
  actualizar-semanal:
    image: alpine:3.20
    container_name: ${CRAFT_NAME:-craftsuite}-actualizar
    profiles: ["auto"]
    restart: unless-stopped
    volumes:
      - ./:/w
    entrypoint: ["sh", "-c", "while true; do sh /w/actualizar.sh; sleep 604800; done"]
