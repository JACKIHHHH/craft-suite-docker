name: craftsuite

services:
  # Servidor web: sirve las apps (archivos estáticos) en http://<ip>:8099
  craftsuite:
    image: nginx:1.27-alpine
    container_name: craftsuite
    restart: unless-stopped
    ports:
      - "${CRAFT_PORT:-8099}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Descarga / actualiza las apps desde GitHub. No arranca solo:
  #   docker compose run --rm actualizar
  actualizar:
    image: alpine:3.20
    profiles: ["update"]
    volumes:
      - ./:/w
    command: ["sh", "/w/actualizar.sh"]
