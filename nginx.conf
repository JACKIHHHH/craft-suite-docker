server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/wasm wasm;
        application/json json;
        image/png png;
        image/svg+xml svg;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;   # comprimir también detrás de un proxy (Caddy, NPM…)
    gzip_types application/wasm text/javascript text/css application/json;

    # Archivos con hash en el nombre: caché permanente
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    # Páginas e índice de versiones: revalidar siempre
    location ~* (\.html|versiones\.json)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
